# docker-compose.production.yml - Production server environment
# Usage: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d

services:
  app:
    container_name: ${APP_NAME}_prod_app
    hostname: ${APP_NAME}_prod_app
    build:
      context: .
      dockerfile: .docker/production/node/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
