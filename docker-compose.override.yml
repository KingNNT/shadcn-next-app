# docker-compose.override.yml - Local development environment
# This file is AUTOMATICALLY loaded by Docker Compose
# No -f flag needed for local development

services:
  app:
    container_name: ${APP_NAME}_local_app
    hostname: ${APP_NAME}_local_app
    build:
      context: .
      dockerfile: .docker/development/node/Dockerfile
      args:
        - UID_HOST_USER=${UID_HOST_USER}
        - GID_HOST_USER=${GID_HOST_USER}
    tty: true
    stdin_open: true
    ports:
      - "3333:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.yarn/cache
    environment:
      - NODE_ENV=development
    env_file:
      - .env
      - .env.local
